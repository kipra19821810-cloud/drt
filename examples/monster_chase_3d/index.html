<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Chase 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;600&display=swap">
<style>
  /* Layout: full-screen 3D scene, HUD pinned top, hint pinned bottom. Single dark night look by choice. */
  :root {
    --bg: #0c130f; --fg: #e8efe6; --muted: #a9bcad; --panel: rgba(12,19,15,0.72);
    --monster: #e8483a; --blood: rgba(150,0,0,0.85); --player: #5cc8f0;
    --display: "Russo One", "Arial Black", system-ui, sans-serif;
    --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
  #game { position: fixed; inset: 0; touch-action: none; }
  #game canvas { display: block; }
  .hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; font-family: var(--display); font-size: clamp(1rem, 4vw, 1.4rem); font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px #000; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, var(--blood) 100%); opacity: 0; }
  .hud button { pointer-events: auto; font: 600 0.8rem var(--body); padding: 6px 10px; background: var(--panel); color: var(--fg); }
  .hint { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); margin: 0; text-align: center; color: var(--muted); font-size: 0.9rem; line-height: 1.5; pointer-events: none; }
  kbd { font-family: var(--body); font-weight: 600; color: var(--fg); background: var(--panel); padding: 1px 6px; border-radius: 4px; }
  .over { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px; background: rgba(5,8,6,0.6); }
  .card { background: var(--panel); padding: 24px 28px; border-radius: 12px; text-align: center; display: flex; flex-direction: column; gap: 10px; max-width: 360px; }
  .card h2 { font-family: var(--display); font-weight: 400; color: var(--monster); font-size: 2.2rem; margin: 0; }
  .card p { margin: 0; }
  button { font: 600 1rem var(--body); color: var(--bg); background: var(--player); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>

<div id="game"></div>
<div class="vignette" id="vig"></div>
<div class="hud"><span id="time">0.0 с</span><span id="best"></span><button id="snd" type="button">Звук: вкл</button></div>
<p class="hint">Беги: <kbd>WASD</kbd> или <kbd>←↑↓→</kbd>, на телефоне — тяни пальцем. Фонарик светит туда, куда бежишь. Чем ближе монстр, тем громче стучит сердце.</p>
<div class="over" id="over" hidden>
  <div class="card">
    <h2>Поймал!</h2>
    <p id="result"></p>
    <button id="again" type="button">Ещё раз (R)</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ARENA = 40;
const root = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
root.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06090a);
scene.fog = new THREE.FogExp2(0x06090a, 0.045);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0x5a6f99, 0x0a120c, 0.28));
const moon = new THREE.DirectionalLight(0x8fa4d0, 0.3);
moon.position.set(15, 30, 10);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, far: 100 });
scene.add(moon);

const mat = (color, roughness = 0.8, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness: 0, ...extra });
function mesh(geo, m, x = 0, y = 0, z = 0, parent) {
  const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true;
  if (parent) parent.add(o); return o;
}
function pivot(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }

// ground, fence, trees
const ground = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2 + 40, ARENA * 2 + 40), mat(0x172a1c, 1));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const postGeo = new THREE.BoxGeometry(0.25, 1.3, 0.25), postMat = mat(0x4a3a2a);
for (let i = -ARENA; i <= ARENA; i += 4)
  for (const [x, z] of [[i, -ARENA], [i, ARENA], [-ARENA, i], [ARENA, i]]) mesh(postGeo, postMat, x, 0.65, z, scene);

const trees = [];
const trunkMat = mat(0x3b2a20, 1);
for (let i = 0; i < 34; i++) {
  const x = (Math.random() * 2 - 1) * (ARENA - 4), z = (Math.random() * 2 - 1) * (ARENA - 4);
  if (Math.hypot(x, z) < 8 || Math.hypot(x, z + 25) < 5) continue;
  const g = pivot(scene, x, 0, z), h = 0.8 + Math.random() * 0.6;
  const leafMat = mat(0x173521, 0.9, { transparent: true });
  mesh(new THREE.CylinderGeometry(0.3, 0.45, 2.4, 8), trunkMat, 0, 1.2, 0, g);
  mesh(new THREE.ConeGeometry(2, 3.5, 8), leafMat, 0, 3.6, 0, g);
  mesh(new THREE.ConeGeometry(1.5, 2.8, 8), leafMat, 0, 5.2, 0, g);
  g.scale.setScalar(h);
  trees.push({ x, z, r: 0.6 * h + 0.3, leafMat });
}

// ---------- human ----------
function makeHuman() {
  const g = new THREE.Group();
  const skin = mat(0xd9a07f, 0.6), shirt = mat(0x7a2e2e, 0.9), jeans = mat(0x2a3650, 0.95);
  const shoe = mat(0x1c1c1c, 0.5), hair = mat(0x2b1a10, 0.95), white = mat(0xf2efe8, 0.4), dark = mat(0x1a1410, 0.4);
  const legs = [], arms = [];
  for (const s of [-1, 1]) {
    const hip = pivot(g, s * 0.11, 0.95, 0);
    mesh(new THREE.CylinderGeometry(0.085, 0.068, 0.46, 12), jeans, 0, -0.23, 0, hip);
    const knee = pivot(hip, 0, -0.46, 0);
    mesh(new THREE.CylinderGeometry(0.066, 0.05, 0.44, 12), jeans, 0, -0.22, 0, knee);
    const shoeM = mesh(new THREE.BoxGeometry(0.11, 0.08, 0.27), shoe, 0, -0.47, 0.05, knee);
    shoeM.geometry.translate(0, 0, 0);
    legs.push({ hip, knee, s });
  }
  const pelvis = mesh(new THREE.CylinderGeometry(0.17, 0.16, 0.16, 16), jeans, 0, 0.98, 0, g); pelvis.scale.z = 0.7;
  const torso = mesh(new THREE.CylinderGeometry(0.21, 0.165, 0.58, 16), shirt, 0, 1.33, 0, g); torso.scale.z = 0.62;
  const chest = mesh(new THREE.SphereGeometry(0.21, 16, 12), shirt, 0, 1.55, 0, g); chest.scale.set(1.08, 0.45, 0.65);
  mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.12, 10), skin, 0, 1.67, 0, g);
  const head = pivot(g, 0, 1.82, 0);
  const skull = mesh(new THREE.SphereGeometry(0.115, 20, 16), skin, 0, 0, 0, head); skull.scale.set(0.95, 1.18, 1.05);
  const hairM = mesh(new THREE.SphereGeometry(0.122, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hair, 0, 0.025, -0.01, head);
  hairM.scale.set(1, 1.15, 1.1); hairM.rotation.x = -0.25;
  for (const s of [-1, 1]) {
    mesh(new THREE.SphereGeometry(0.018, 8, 6), white, s * 0.042, 0.02, 0.1, head);
    mesh(new THREE.SphereGeometry(0.009, 6, 4), dark, s * 0.042, 0.02, 0.116, head);
    mesh(new THREE.SphereGeometry(0.022, 8, 6), skin, s * 0.118, 0.0, 0, head); // ears
  }
  const nose = mesh(new THREE.ConeGeometry(0.018, 0.045, 6), skin, 0, -0.015, 0.125, head); nose.rotation.x = Math.PI / 2;
  mesh(new THREE.BoxGeometry(0.045, 0.008, 0.01), mat(0x8a4a40, 0.6), 0, -0.065, 0.11, head);
  for (const s of [-1, 1]) {
    const sh = pivot(g, s * 0.25, 1.56, 0); sh.rotation.z = s * 0.1;
    mesh(new THREE.SphereGeometry(0.07, 10, 8), shirt, 0, 0, 0, sh);
    mesh(new THREE.CylinderGeometry(0.062, 0.052, 0.3, 10), shirt, 0, -0.15, 0, sh);
    const el = pivot(sh, 0, -0.3, 0);
    mesh(new THREE.CylinderGeometry(0.045, 0.036, 0.27, 10), skin, 0, -0.135, 0, el);
    const hand = mesh(new THREE.SphereGeometry(0.048, 10, 8), skin, 0, -0.31, 0, el); hand.scale.set(0.8, 1.2, 0.6);
    arms.push({ sh, el, s });
  }
  return { g, legs, arms, head };
}

// ---------- monster ----------
function makeMonster() {
  const g = new THREE.Group();
  const hide = mat(0x14100f, 0.55), flesh = mat(0x3a1414, 0.7), bone = mat(0xcfc3a3, 0.5);
  const maw = mat(0x400000, 0.6, { emissive: 0x6a0000, emissiveIntensity: 0.8 });
  const eyeM = mat(0xff2a00, 0.3, { emissive: 0xff1a00, emissiveIntensity: 3 });
  const legs = [], arms = [];
  for (const s of [-1, 1]) {
    const hip = pivot(g, s * 0.38, 1.7, 0);
    mesh(new THREE.CylinderGeometry(0.17, 0.11, 0.95, 10), hide, 0, -0.47, 0, hip);
    const knee = pivot(hip, 0, -0.95, 0);
    mesh(new THREE.CylinderGeometry(0.1, 0.06, 0.85, 10), hide, 0, -0.42, 0, knee);
    for (const c of [-1, 0, 1]) { const cl = mesh(new THREE.ConeGeometry(0.035, 0.22, 6), bone, c * 0.07, -0.86, 0.12, knee); cl.rotation.x = Math.PI / 2; }
    legs.push({ hip, knee, s });
  }
  const spine = pivot(g, 0, 1.7, 0); spine.rotation.x = 0.55; // hunched forward
  const torso = mesh(new THREE.CylinderGeometry(0.55, 0.3, 1.5, 14), hide, 0, 0.75, 0, spine); torso.scale.z = 0.75;
  for (let i = 0; i < 7; i++) { // spikes on the back
    const sp = mesh(new THREE.ConeGeometry(0.07, 0.45 - i * 0.03, 6), bone, 0, 0.2 + i * 0.2, -0.4 + i * 0.01, spine);
    sp.rotation.x = -1.1;
  }
  const head = pivot(spine, 0, 1.6, 0.1); head.rotation.x = -0.75;
  const skull = mesh(new THREE.SphereGeometry(0.38, 18, 14), flesh, 0, 0.1, 0.1, head); skull.scale.set(0.85, 0.85, 1.25);
  mesh(new THREE.SphereGeometry(0.26, 14, 10), maw, 0, -0.02, 0.38, head).scale.set(1, 0.7, 0.8);
  const jaw = pivot(head, 0, -0.08, 0.05);
  const jawM = mesh(new THREE.SphereGeometry(0.3, 14, 10, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), flesh, 0, 0, 0.3, jaw); jawM.scale.set(0.85, 0.6, 1.3);
  for (let i = 0; i < 9; i++) {
    const a = (i / 8 - 0.5) * 2.2, x = Math.sin(a) * 0.24, z = 0.38 + Math.cos(a) * 0.24;
    const t = mesh(new THREE.ConeGeometry(0.035, 0.17, 5), bone, x, -0.02, z, head); t.rotation.x = Math.PI;
    mesh(new THREE.ConeGeometry(0.03, 0.14, 5), bone, x * 0.9, 0.05, z - 0.02, jaw);
  }
  for (const [x, y, r] of [[-0.16, 0.24, 0.07], [0.16, 0.24, 0.07], [-0.27, 0.32, 0.04], [0.27, 0.32, 0.04]]) mesh(new THREE.SphereGeometry(r, 10, 8), eyeM, x, y, 0.5, head);
  for (const s of [-1, 1]) { const h = mesh(new THREE.ConeGeometry(0.08, 0.7, 8), bone, s * 0.25, 0.45, -0.05, head); h.rotation.set(-0.8, 0, -s * 0.5); }
  const eyeGlow = new THREE.PointLight(0xff2000, 2.2, 9, 2); eyeGlow.position.set(0, 0.3, 0.8); head.add(eyeGlow);
  for (const s of [-1, 1]) {
    const sh = pivot(spine, s * 0.58, 1.3, 0.05); sh.rotation.z = s * 0.15;
    mesh(new THREE.CylinderGeometry(0.1, 0.075, 1.15, 10), hide, 0, -0.57, 0, sh);
    const el = pivot(sh, 0, -1.15, 0);
    mesh(new THREE.CylinderGeometry(0.075, 0.05, 1.1, 10), hide, 0, -0.55, 0, el);
    for (const c of [-1, 0, 1]) { const cl = mesh(new THREE.ConeGeometry(0.03, 0.42, 6), bone, c * 0.06, -1.25, 0.04, el); cl.rotation.x = Math.PI - 0.3; }
    arms.push({ sh, el, s });
  }
  return { g, legs, arms, head, jaw };
}

const human = makeHuman(), player = human.g; scene.add(player);
const flash = new THREE.SpotLight(0xfff0d0, 3, 26, 0.45, 0.6, 1.5);
flash.position.set(0.25, 1.4, 0.15); flash.castShadow = true; flash.shadow.mapSize.set(1024, 1024);
const flashTarget = new THREE.Object3D(); flashTarget.position.set(0, 0, 8);
player.add(flash, flashTarget); flash.target = flashTarget;

const beast = makeMonster(), monster = beast.g; scene.add(monster);

// ---------- heartbeat audio ----------
let actx = null, soundOn = true, nextBeat = 0;
const sndBtn = document.getElementById('snd');
function initAudio() { if (!actx) try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
sndBtn.addEventListener('click', e => { e.stopPropagation(); initAudio(); soundOn = !soundOn; sndBtn.textContent = 'Звук: ' + (soundOn ? 'вкл' : 'выкл'); });
function thump(t, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.15);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.22);
}
function roar() {
  if (!actx || !soundOn) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 1.2);
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 1.3);
}

// ---------- state & input ----------
const keys = {};
let time, best = 0, over, drag = null, runPhase = 0, mPhase = 0, overAt = 0;
const timeEl = document.getElementById('time'), bestEl = document.getElementById('best');
const overEl = document.getElementById('over'), resultEl = document.getElementById('result'), vig = document.getElementById('vig');

function reset() {
  player.position.set(0, 0, 0); player.rotation.set(0, Math.PI, 0);
  monster.position.set(0, 0, -25);
  time = 0; over = false;
  overEl.hidden = true;
}
function pushOut(obj, r) {
  for (const t of trees) {
    const dx = obj.position.x - t.x, dz = obj.position.z - t.z, d = Math.hypot(dx, dz), min = t.r + r;
    if (d < min && d > 0) { obj.position.x = t.x + dx / d * min; obj.position.z = t.z + dz / d * min; }
  }
  const lim = ARENA - r;
  obj.position.x = Math.max(-lim, Math.min(lim, obj.position.x));
  obj.position.z = Math.max(-lim, Math.min(lim, obj.position.z));
}
addEventListener('keydown', e => {
  initAudio();
  const k = e.key.toLowerCase();
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
  keys[k] = true;
  if (k === 'r' || k === 'к' || (over && k === 'enter')) reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
root.addEventListener('pointerdown', e => { initAudio(); drag = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY }; });
addEventListener('pointermove', e => { if (drag) { drag.x = e.clientX; drag.y = e.clientY; } });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointercancel', () => { drag = null; });
document.getElementById('again').addEventListener('click', reset);

function animateLimbs(rig, phase, amp, kneeBend, armBase, elbowBase) {
  for (const l of rig.legs) {
    const p = phase + (l.s > 0 ? Math.PI : 0);
    l.hip.rotation.x = Math.sin(p) * amp;
    l.knee.rotation.x = kneeBend + Math.max(0, Math.cos(p)) * amp * 1.4;
  }
  for (const a of rig.arms) {
    const p = phase + (a.s > 0 ? 0 : Math.PI);
    a.sh.rotation.x = armBase + Math.sin(p) * amp * 0.9;
    a.el.rotation.x = elbowBase;
  }
}

function update(dt) {
  if (over) {
    // monster holds its prey: jaw wide open
    beast.jaw.rotation.x = 0.7;
    return;
  }
  time += dt;
  let dx = 0, dz = 0;
  if (keys['arrowleft'] || keys['a'] || keys['ф']) dx--;
  if (keys['arrowright'] || keys['d'] || keys['в']) dx++;
  if (keys['arrowup'] || keys['w'] || keys['ц']) dz--;
  if (keys['arrowdown'] || keys['s'] || keys['ы']) dz++;
  if (drag) { const ox = drag.x - drag.sx, oy = drag.y - drag.sy; if (Math.hypot(ox, oy) > 12) { dx = ox; dz = oy; } }
  const len = Math.hypot(dx, dz), speed = 7;
  if (len) {
    player.position.x += dx / len * speed * dt;
    player.position.z += dz / len * speed * dt;
    const target = Math.atan2(dx, dz);
    let diff = target - player.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.rotation.y += diff * Math.min(1, dt * 14);
    runPhase += dt * 11;
    animateLimbs(human, runPhase, 0.75, 0.15, 0, -1.3);
    player.position.y = Math.abs(Math.sin(runPhase)) * 0.06;
  } else {
    runPhase = 0;
    animateLimbs(human, 0, 0, 0.02, 0, -0.15);
    player.position.y = 0;
  }
  pushOut(player, 0.35);

  const mSpeed = 4 + time * 0.18;
  const mx = player.position.x - monster.position.x, mz = player.position.z - monster.position.z, d = Math.hypot(mx, mz);
  if (d) { monster.position.x += mx / d * mSpeed * dt; monster.position.z += mz / d * mSpeed * dt; }
  pushOut(monster, 0.9);
  monster.rotation.y = Math.atan2(mx, mz);
  mPhase += dt * mSpeed * 1.1;
  animateLimbs(beast, mPhase, 0.55, 0.35, -1.0, -0.5); // long arms reach forward
  for (const a of beast.arms) a.sh.rotation.x = -1.2 + Math.sin(mPhase * 2 + a.s) * 0.35; // clawing
  beast.jaw.rotation.x = 0.25 + Math.abs(Math.sin(time * 3)) * 0.35;
  beast.head.rotation.z = Math.sin(time * 1.7) * 0.15; // twitchy head
  monster.position.y = Math.abs(Math.sin(mPhase)) * 0.12;

  const fear = Math.max(0, Math.min(1, 1 - (d - 2) / 14));
  vig.style.opacity = (fear * 0.9).toFixed(2);
  if (actx && soundOn && actx.currentTime >= nextBeat) {
    const t = actx.currentTime, gap = 1.1 - fear * 0.75, vol = 0.15 + fear * 0.6;
    thump(t, vol); thump(t + 0.18, vol * 0.7); nextBeat = t + gap;
  }

  if (d < 1.4) {
    over = true; overAt = time; best = Math.max(best, time);
    resultEl.textContent = 'Ты продержался ' + time.toFixed(1) + ' с';
    overEl.hidden = false; vig.style.opacity = 1; roar();
  }
  timeEl.textContent = time.toFixed(1) + ' с';
  bestEl.textContent = best ? 'Рекорд ' + best.toFixed(1) + ' с' : '';
}

function resize() {
  const w = root.clientWidth, h = root.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const camTarget = new THREE.Vector3();
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
  update(dt);
  camTarget.set(player.position.x, 5.5, player.position.z + 6.5);
  for (const t of trees) { // fade trees that hide the player from the camera
    const hide = t.z > player.position.z - 1 && t.z < camera.position.z + 2 && Math.abs(t.x - player.position.x) < 3;
    t.leafMat.opacity += ((hide ? 0.25 : 1) - t.leafMat.opacity) * 0.15;
  }
  camera.position.lerp(camTarget, 0.08);
  camera.lookAt(player.position.x, 1.2, player.position.z - 1);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
reset(); resize();
camera.position.set(0, 5.5, 6.5);
requestAnimationFrame(loop);
</script>
</body>
</html>
