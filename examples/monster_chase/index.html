<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Chase</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
  canvas { background: #1e2a1e; max-width: 100vw; touch-action: none; }
  p { margin: 8px; }
</style>
</head>
<body>
<p>Стрелки / WASD (или палец) — беги. Монстр ускоряется. R — заново.</p>
<canvas id="c" width="600" height="400"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const keys = {};
let player, monster, time, over, touch = null, last = performance.now();

function reset() {
  player = { x: 100, y: 200, r: 12, speed: 220 };
  monster = { x: 500, y: 200, r: 18, speed: 120 };
  time = 0; over = false;
}

addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.toLowerCase() === 'r') reset(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function touchPos(e) {
  const b = cv.getBoundingClientRect(), t = e.touches[0] || e.changedTouches[0];
  return { x: (t.clientX - b.left) * cv.width / b.width, y: (t.clientY - b.top) * cv.height / b.height };
}
cv.addEventListener('touchstart', e => { e.preventDefault(); if (over) reset(); touch = touchPos(e); });
cv.addEventListener('touchmove', e => { e.preventDefault(); touch = touchPos(e); });
cv.addEventListener('touchend', () => { touch = null; });

function update(dt) {
  if (over) return;
  time += dt;
  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx--;
  if (keys['arrowright'] || keys['d']) dx++;
  if (keys['arrowup'] || keys['w']) dy--;
  if (keys['arrowdown'] || keys['s']) dy++;
  if (touch) { dx = touch.x - player.x; dy = touch.y - player.y; if (Math.hypot(dx, dy) < 5) dx = dy = 0; }
  const len = Math.hypot(dx, dy);
  if (len) { player.x += dx / len * player.speed * dt; player.y += dy / len * player.speed * dt; }
  player.x = Math.max(player.r, Math.min(cv.width - player.r, player.x));
  player.y = Math.max(player.r, Math.min(cv.height - player.r, player.y));

  monster.speed = 120 + time * 6; // монстр постепенно ускоряется
  const mx = player.x - monster.x, my = player.y - monster.y, d = Math.hypot(mx, my);
  if (d) { monster.x += mx / d * monster.speed * dt; monster.y += my / d * monster.speed * dt; }
  if (d < player.r + monster.r) over = true;
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  // игрок
  ctx.fillStyle = '#4fc3f7';
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
  // монстр
  ctx.fillStyle = '#e53935';
  ctx.beginPath(); ctx.arc(monster.x, monster.y, monster.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(monster.x + s * 6, monster.y - 4, 4, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#000';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(monster.x + s * 6, monster.y - 4, 2, 0, Math.PI * 2); ctx.fill(); }
  // счёт
  ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Время: ' + time.toFixed(1) + ' c', 10, 24);
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '32px sans-serif';
    ctx.fillText('Монстр тебя поймал!', cv.width / 2, cv.height / 2 - 10);
    ctx.font = '18px sans-serif';
    ctx.fillText('Ты продержался ' + time.toFixed(1) + ' c. Нажми R (или коснись), чтобы сыграть ещё', cv.width / 2, cv.height / 2 + 24);
  }
}

function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
